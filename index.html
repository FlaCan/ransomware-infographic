<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme:
      // an explicit choice in localStorage wins, otherwise follow the OS.
      (function () {
        const stored = localStorage.getItem("theme")
        const theme =
          stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive infographic describing a Ransomware attack"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap"
    />
    <style>
      /* The page is only the frame: the infographic is the <ransomware-infographic> component */
      html, body { height: 100%; margin: 0; overflow: hidden; background: #f2f2f3; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #262628; }
      ransomware-infographic { height: 100vh; height: 100dvh; }
    </style>
    <title>Ransomware: attack and defences</title>
  </head>
  <body>
    <ransomware-infographic controls standalone></ransomware-infographic>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script type="module" src="ransomware-infographic.js"></script>
    <script
      data-goatcounter="https://ransomware.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
